# gitleaks configuration for AegisFlow (gitleaks v8.30.x; version pinned in mk/code-security.mk).
#
# Policy:
#   - The full upstream ruleset applies (`useDefault = true`); nothing is disabled.
#   - Allow-list entries live ONLY in this file (CI runs with --ignore-gitleaks-allow, so inline
#     `gitleaks:allow` comments are not honoured). Every entry must be narrow (path AND value),
#     point at a verified synthetic fixture, and say why it is safe. Never allow-list a real secret:
#     rotate it, then purge it from history.

title = "AegisFlow gitleaks configuration"

[extend]
useDefault = true

# Synthetic request-ID fixture in the X-Request-ID validation test
# ({"valid token chars", "abc_DEF.123-xyz", true}). It is a made-up string that exercises the
# allowed character set of request IDs; it is not a credential and grants access to nothing.
# Matched by `generic-api-key` (first seen in commit 95761d9). Both the path and the exact value
# must match (condition AND), so a real key added to the same file is still reported.
[[allowlists]]
description = "Synthetic request-ID test fixture (internal/server/server_test.go)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^internal/server/server_test\.go$''']
regexTarget = "secret"
regexes = ['''^abc_DEF\.123-xyz$''']

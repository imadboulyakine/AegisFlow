rules:
  - id: gha-run-untrusted-interpolation
    message: >-
      Expression interpolated into a script. `${{ github.event.* }}`, `github.head_ref`, inputs and
      step outputs are expanded into the script text before the shell runs, so attacker-controlled
      values (PR titles, branch names, commit messages) become code. Pass them through `env:` and
      reference "$VAR" in the script (ADR-006).
    severity: ERROR
    languages: [yaml]
    paths:
      include:
        - /.github/
    metadata:
      category: security
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      references:
        - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
    patterns:
      - pattern-either:
          - pattern: "run: $SCRIPT"
          - patterns:
              - pattern-inside: |
                  uses: $ACTION
                  ...
              - metavariable-regex:
                  metavariable: $ACTION
                  regex: ^actions/github-script@
              - pattern: "script: $SCRIPT"
      - metavariable-regex:
          metavariable: $SCRIPT
          regex: '(?s).*\$\{\{[^}]*\b(github\.event\.|github\.head_ref|inputs\.|steps\.[A-Za-z0-9_-]+\.outputs\.|needs\.[A-Za-z0-9_-]+\.outputs\.)'

# Build provenance and keyless signing of the aegisflow binary (ADR-009, ADR-014; Phase 1b).
#
#   build   every trigger   reproducible `make provenance-build`, SHA256SUMS, CycloneDX SBOM, self-checks.
#                           No id-token: this is the only job that runs third-party build code
#                           (bun packages, Go toolchain), so it can never mint a signing identity.
#   sign    main, public    GitHub artifact attestations (SLSA build provenance + SBOM) and a Sigstore
#                           keyless cosign signature over the exact bytes the build job hashed.
#   verify  after sign      a verifier with read-only permissions re-checks everything with the
#                           commands a third party runs (`make verify-provenance`), plus negative tests.
#
# Pull requests run `build` only (dry run: proves the build path, no OIDC token, nothing signed).
# Attestations and keyless signing need a public repository (attestations are public-repo only on
# GitHub Free/Pro; keyless cosign writes repo/workflow/commit metadata to the public Rekor log), so
# `sign` is gated on `github.event.repository.visibility == 'public'` (a missing value is false).
# Only refs/heads/main is signed; workflow_dispatch on another branch is a dry run.
# Nothing is published: no release, no image push (needs owner approval). Outputs are run artifacts.
#
# Supply-chain rules as in ci.yml: actions pinned to full commit SHAs, read-only token by default,
# permissions widened per job, no persisted credentials, no `${{ }}` inside `run:` scripts, no
# caches in a job whose output gets signed (cache-poisoning).
name: Provenance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provenance-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a main run half-way through signing; superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COSIGN_VERSION: v3.1.4 # installed and signature-verified by sigstore/cosign-installer

jobs:
  build:
    name: Build · reproducible binary, checksums, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod toolchain directive)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # signed output: build from a clean module/build cache

      - name: Set up Bun (version from web/package.json packageManager)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
          no-cache: true # signed output: no restored tool cache

      # VERSION=ci-<commit>, COMMIT=<commit>, BUILD_DATE=<commit time>: anyone can rebuild the same
      # bytes from a clean checkout with `make reproduce` (see mk/provenance.mk).
      - name: Build (reproducible)
        run: make provenance-build

      - name: Checksums and SBOM
        run: |
          make checksums
          make provenance-sbom

      - name: Self-check (checksum, embedded commit, SBOM bound to the binary)
        run: |
          make provenance-check
          test "$(./bin/aegisflow -version | jq -r .commit)" = "$GITHUB_SHA"

      - name: Record digest
        id: digest
        run: |
          sha256="$(sha256sum bin/aegisflow | cut -d' ' -f1)"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          {
            echo "### Build provenance inputs"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Binary | \`bin/aegisflow\` ($(stat -c %s bin/aegisflow) bytes) |"
            echo "| sha256 | \`${sha256}\` |"
            echo "| Version metadata | \`$(./bin/aegisflow -version | jq -c .)\` |"
            echo "| SBOM | \`aegisflow.cdx.json\`: $(jq -r '[.components[] | select(.purl) | .purl] | join(", ")' bin/aegisflow.cdx.json) |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build outputs (unsigned)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegisflow-build
          path: |
            bin/aegisflow
            bin/SHA256SUMS
            bin/aegisflow.cdx.json
          if-no-files-found: error
          retention-days: 7 # hand-off to `sign`; on main the signed artifact keeps the same files 30 days

  sign:
    name: Sign · build provenance, SBOM attestation, cosign keyless
    needs: build
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sigstore keyless: OIDC token for the Fulcio certificate (attest + cosign)
      attestations: write # store the attestations in the repository's attestation API
    steps:
      # No checkout: this job runs no repository code, only pinned signing actions.
      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aegisflow-build
          path: signed

      - name: Check the binary is the one the build job hashed
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          echo "${EXPECTED_SHA256}  signed/aegisflow" | sha256sum -c
          (cd signed && sha256sum -c SHA256SUMS)

      - name: Attest build provenance (SLSA v1)
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: signed/aegisflow # no predicate inputs = SLSA build provenance mode

      - name: Attest SBOM (CycloneDX)
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: signed/aegisflow
          sbom-path: signed/aegisflow.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the binary (Sigstore keyless, GitHub OIDC identity)
        run: |
          cosign version
          cosign sign-blob --yes --bundle signed/aegisflow.sigstore.json signed/aegisflow

      - name: Collect attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_URL: ${{ steps.sbom.outputs.attestation-url }}
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/provenance.yml@${{ github.ref }}
        run: |
          cp "$PROVENANCE_BUNDLE" signed/aegisflow.provenance.sigstore.json
          cp "$SBOM_BUNDLE" signed/aegisflow.sbom.sigstore.json
          {
            echo "### Signed: \`aegisflow\` \`sha256:$(sha256sum signed/aegisflow | cut -d' ' -f1)\`"
            echo
            echo "- Build provenance attestation: ${PROVENANCE_URL}"
            echo "- SBOM attestation: ${SBOM_URL}"
            echo "- cosign bundle: \`aegisflow.sigstore.json\`, identity \`${CERT_IDENTITY}\`"
            echo "- Artifact \`aegisflow-signed\` (30 days); verify with \`make verify-provenance\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegisflow-signed
          path: signed/
          if-no-files-found: error
          retention-days: 30

  # Runs only when `sign` succeeded (a skipped or failed `needs` job skips this one).
  verify:
    name: Verify · as a third party would
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read # `gh attestation verify --repo` reads the repository's attestation API
    env:
      PROVENANCE_REPO: ${{ github.repository }}
      PROVENANCE_REF: ${{ github.ref }}
      PROVENANCE_COMMIT: ${{ github.sha }}
      CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/provenance.yml@${{ github.ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Checkout (Makefile only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download signed outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aegisflow-signed
          path: ${{ runner.temp }}/aegisflow-signed

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Offline-capable path a jury uses: bundles from the artifact, no GitHub login.
      - name: Verify from the downloaded bundles (no GitHub token)
        run: |
          make verify-provenance PROVENANCE_DIR="$RUNNER_TEMP/aegisflow-signed" \
            PROVENANCE_ATTESTATIONS=bundle PROVENANCE_CERT_IDENTITY="$CERT_IDENTITY"

      # Online path: attestations fetched by digest from the repository's attestation store.
      - name: Verify from the GitHub attestation API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make verify-provenance PROVENANCE_DIR="$RUNNER_TEMP/aegisflow-signed" \
            PROVENANCE_ATTESTATIONS=api PROVENANCE_CERT_IDENTITY="$CERT_IDENTITY"

      # Negative controls: verification must reject a modified binary and a foreign identity.
      - name: Negative tests (tampered binary, wrong identity)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/aegisflow-signed"
          cp "$dir/aegisflow" "$RUNNER_TEMP/tampered"
          printf 'x' >> "$RUNNER_TEMP/tampered"
          if cosign verify-blob "$RUNNER_TEMP/tampered" --bundle "$dir/aegisflow.sigstore.json" \
            --certificate-identity "$CERT_IDENTITY" --certificate-oidc-issuer "$OIDC_ISSUER"; then
            echo "::error::cosign accepted a tampered binary"; exit 1
          fi
          if gh attestation verify "$RUNNER_TEMP/tampered" --repo "$PROVENANCE_REPO"; then
            echo "::error::gh accepted a tampered binary"; exit 1
          fi
          if cosign verify-blob "$dir/aegisflow" --bundle "$dir/aegisflow.sigstore.json" \
            --certificate-identity "https://github.com/${PROVENANCE_REPO}/.github/workflows/provenance.yml@refs/heads/attacker" \
            --certificate-oidc-issuer "$OIDC_ISSUER"; then
            echo "::error::cosign accepted a foreign signing identity"; exit 1
          fi
          echo "negative tests: tampered binary and foreign identity rejected" | tee -a "$GITHUB_STEP_SUMMARY"

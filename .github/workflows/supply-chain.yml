# Supply-chain scanning of AegisFlow itself (Phase 1a): SCA, SBOMs and container image scan.
#
# Every job is an evidence producer for Phase 2. Reports are uploaded as artifacts with stable
# names (retention 7 days) and summarised in the job summary. The commands live in
# mk/supply-chain.mk, so CI and local runs are the same (`make supply-chain`); tool versions and
# image digests are pinned there (ADR-015).
#
# Gates (what turns a job red):
#   go-vulns             govulncheck: a vulnerable symbol is called from our code (exit 3)
#   deps                 osv-scanner: ANY known vulnerability in go.mod (incl. the toolchain's
#                        stdlib) or web/bun.lock (incl. dev deps) that osv-scanner.toml does not
#                        except with a reason + expiry; or a lockfile yields no packages
#   sbom-and-image-scan  Grype on the image SBOM: a High/Critical match with a fix available
#
# Code scanning: SARIF is uploaded only when the repository is public (a missing
# `github.event.repository.visibility` evaluates to false) and the token may write security
# events (not on fork PRs). The SARIF files are always kept as artifacts.
#
# Hardening as in ci.yml: actions pinned to full commit SHAs, read-only token by default,
# `security-events: write` only on the jobs that upload SARIF, no persisted credentials, no
# untrusted event data in `run:`.
name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "47 5 * * 1" # Mondays 05:47 UTC: re-scan unchanged code against updated vulnerability data
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish so their evidence is complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-vulns:
    name: Go · govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod toolchain directive)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # govulncheck compiles in ~15 s. Reusing ci.yml's go.mod-keyed cache would race with it:
          # whichever job saves first decides what the other one restores.
          cache: false

      - name: Evidence (JSON + OpenVEX)
        run: make vuln-evidence

      - name: Gate (fails on called vulnerabilities)
        run: make vuln

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          f=bin/supply-chain/govulncheck.summary.md
          if [[ -f "$f" ]]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload govulncheck-json
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck-json
          path: bin/supply-chain/govulncheck.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload govulncheck-openvex
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck-openvex
          path: bin/supply-chain/govulncheck.openvex.json
          retention-days: 7
          if-no-files-found: error

  deps:
    name: Dependencies · osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning (public repository only)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (version from go.mod toolchain directive)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # only the built osv-scanner binary is cached (below), not ~3 GB of modules

      # osv-scanner is built from source (sum.golang.org-verified) with the project toolchain; a
      # cold build takes ~2-3 min, so the resulting binary (versioned file name) is cached.
      # Restore and save are split so the cache is saved even when the scan below fails.
      - name: Restore osv-scanner binary
        id: osv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: osv-scanner-${{ runner.os }}-${{ hashFiles('go.mod', 'mk/supply-chain.mk') }}
          restore-keys: osv-scanner-${{ runner.os }}-

      - name: Build osv-scanner (skipped when the cached binary matches)
        run: make osv-scanner-bin

      - name: Save osv-scanner binary
        if: steps.osv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/tools
          key: ${{ steps.osv-cache.outputs.cache-primary-key }}

      - name: Scan go.mod and web/bun.lock (gate)
        run: make osv

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          f=bin/supply-chain/osv-scanner.summary.md
          if [[ -f "$f" ]]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload osv-scanner-json
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-scanner-json
          path: bin/supply-chain/osv-scanner.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload osv-scanner-sarif
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-scanner-sarif
          path: bin/supply-chain/osv-scanner.sarif
          retention-days: 7
          if-no-files-found: error

      - name: Upload SARIF to code scanning (public repository only)
        if: >-
          ${{ !cancelled()
          && github.event.repository.visibility == 'public'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && hashFiles('bin/supply-chain/osv-scanner.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: bin/supply-chain/osv-scanner.sarif
          category: osv-scanner

  sbom-and-image-scan:
    name: SBOM + image scan · Syft, Grype
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning (public repository only)
    env:
      IMAGE: aegisflow:supply-chain
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Commit time instead of wall-clock time, so rebuilding the same commit reuses the cache.
      - name: Build metadata
        id: meta
        run: echo "build-date=$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Same Dockerfile and build args as ci.yml; separate cache scope so the two workflows do
      # not overwrite each other's mode=max cache.
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build-date }}
          cache-from: type=gha,scope=aegisflow-supply-chain
          cache-to: type=gha,scope=aegisflow-supply-chain,mode=max

      - name: SBOMs of the source tree and the image (Syft)
        run: make sbom IMAGE="$IMAGE"

      - name: Image scan (Grype; gate)
        run: make grype

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          for f in bin/supply-chain/sbom.summary.md bin/supply-chain/grype-image.summary.md; do
            if [[ -f "$f" ]]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload sbom-source-cyclonedx
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-source-cyclonedx
          path: bin/supply-chain/sbom-source.cdx.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload sbom-source-spdx
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-source-spdx
          path: bin/supply-chain/sbom-source.spdx.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload sbom-image-cyclonedx
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image-cyclonedx
          path: bin/supply-chain/sbom-image.cdx.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload sbom-image-spdx
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image-spdx
          path: bin/supply-chain/sbom-image.spdx.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload sbom-image-syft
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image-syft
          path: bin/supply-chain/sbom-image.syft.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload grype-image-json
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-image-json
          path: bin/supply-chain/grype-image.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload grype-image-sarif
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-image-sarif
          path: bin/supply-chain/grype-image.sarif
          retention-days: 7
          if-no-files-found: error

      - name: Upload SARIF to code scanning (public repository only)
        if: >-
          ${{ !cancelled()
          && github.event.repository.visibility == 'public'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && hashFiles('bin/supply-chain/grype-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: bin/supply-chain/grype-image.sarif
          category: grype-image

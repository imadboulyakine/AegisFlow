# Dependabot version updates (ADR-006). Weekly, minor/patch grouped per ecosystem to keep
# PR noise (and private-repo Actions minutes) low; majors arrive as individual PRs.
# `cooldown` skips version-update releases younger than 7 days (zizmor's default; security updates
# are not delayed). Bun's install-time minimumReleaseAge (web/bunfig.toml) stays at 3 days.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(go)"
    labels: [dependencies, go]

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(web)"
    labels: [dependencies, web]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(actions)"
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(docker)"
    labels: [dependencies, docker]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(compose)"
    labels: [dependencies, docker]

  # Hash-pinned Python tool requirements for CI (zizmor), installed with --require-hashes.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      ci-tools-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(ci)"
    labels: [dependencies, ci]

# Dependabot version updates (ADR-006). Weekly, minor/patch grouped per ecosystem to keep
# PR noise (and private-repo Actions minutes) low; majors arrive as individual PRs.
# `cooldown` skips releases younger than 3 days, mirroring web/bunfig.toml minimumReleaseAge.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(go)"
    labels: [dependencies, go]

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(web)"
    labels: [dependencies, web]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(actions)"
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(docker)"
    labels: [dependencies, docker]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(compose)"
    labels: [dependencies, docker]
